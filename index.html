<!DOCTYPE html>
<html lang="en" class="overflow-x-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CoreGrip</title>
  
  <meta name="theme-color" content="#0066FF">
  <meta name="description" content="CoreGrip - Enterprise-grade resistance training log and auto-progression tracking application.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CoreGrip">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/5200/5200814.png">
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/5200/5200814.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body { font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; }
    :root {
      --bg-page: #f9fafb; --bg-card: #ffffff; --bg-header: #161B26; --text-header: #ffffff;
      --bg-subcard: #eff6ff; --bg-input: #ffffff; --text-main: #1f2937; --text-muted: #6b7280;
      --border-color: #e2e8f0; --border-strong: #cbd5e1; --accent-primary: #0066FF;
      --shadow-color: rgba(0, 102, 255, 0.08); --table-header-bg: #eff6ff; --table-header-text: #0066FF;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-page: #0f172a; --bg-card: #1e293b; --bg-header: #161B26; --text-header: #f8fafc;
        --bg-subcard: rgba(30, 58, 138, 0.4); --bg-input: #0f172a; --text-main: #f8fafc;
        --text-muted: #cbd5e1; --border-color: #334155; --border-strong: #475569;
        --accent-primary: #3b82f6; --shadow-color: rgba(0, 0, 0, 0.3);
      }
    }
    body { background-color: var(--bg-page); color: var(--text-main); transition: background-color 0.3s ease, color 0.3s ease; }
    .themed-header { background-color: var(--bg-header); color: var(--text-header); }
    .themed-card { background-color: var(--bg-card); border: 1px solid var(--border-color); box-shadow: 0 10px 25px -5px var(--shadow-color); }
    .themed-subcard { background-color: var(--bg-subcard); border: 1px solid var(--border-color); }
    .themed-input { background-color: var(--bg-input) !important; border-color: var(--border-strong) !important; color: var(--text-main) !important; }
    .themed-input:focus { border-color: var(--accent-primary) !important; box-shadow: 0 0 0 3px var(--shadow-color) !important; }
    .themed-text-muted { color: var(--text-muted); }
    .themed-table-header { background-color: var(--table-header-bg); color: var(--table-header-text); }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
    @media (max-width: 640px) { input, select, button { min-height: 44px; font-size: 16px !important; } }
  </style>
</head>
<body class="font-sans min-h-screen flex flex-col antialiased">

  <!-- Header -->
  <header class="themed-header border-b border-gray-800 shadow-sm sticky top-0 z-40 w-full transition-colors duration-300">
    <div class="max-w-7xl mx-auto px-4 py-2.5 flex justify-between items-center w-full h-14">
      <div class="flex items-center space-x-6">
        <h1 class="font-black tracking-wider text-sm md:text-base leading-none uppercase text-white">CoreGrip</h1>
        <nav id="headerNavTabs" class="hidden items-center space-x-1">
          <button id="navWorkoutBtn" onclick="switchAppTab('workout')" class="px-3.5 py-1.5 text-xs font-bold rounded-lg bg-blue-600">Workout Log</button>
        </nav>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto p-3 sm:p-4 md:p-6">
    <!-- Form Workout -->
    <div id="tabWorkout" class="p-3 sm:p-4 md:p-6 space-y-4 md:space-y-6">
      <form id="formWorkout" onsubmit="addOrUpdateWorkout(event)" class="themed-subcard p-4 sm:p-5 md:p-6 rounded-2xl border space-y-4">
        <h3 class="font-bold text-xs sm:text-sm text-blue-600">Log Exercise Record</h3>
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-6 gap-3 sm:gap-4">
          <!-- Input fields remain as provided -->
          <input type="number" id="inputProject" value="1" class="hidden">
          <input type="number" id="inputBodyWeight" value="70" class="hidden">
          <select id="inputDaySession" required class="w-full px-3 py-2 themed-input rounded-xl border text-sm">
            <option value="">-- Select Session --</option>
            <option value="Mon - Upper A">Mon - Upper A</option>
          </select>
          <select id="inputExercise" required class="w-full px-3 py-2 themed-input rounded-xl border text-sm"></select>
          <input type="text" id="inputTargetReps" readonly required class="w-full px-3 py-2 themed-input rounded-xl border text-sm">
        </div>
        <input type="number" id="inputWorkingLoad" placeholder="Load (kg)" required class="w-full px-3 py-2 themed-input rounded-xl border text-sm">
        <div class="grid grid-cols-4 gap-2">
            <input type="number" id="inputSet1" placeholder="Set 1" class="themed-input rounded-xl border text-center text-sm">
            <input type="number" id="inputSet2" placeholder="Set 2" class="themed-input rounded-xl border text-center text-sm">
            <input type="number" id="inputSet3" placeholder="Set 3" class="themed-input rounded-xl border text-center text-sm">
            <input type="number" id="inputSet4" placeholder="Set 4" class="themed-input rounded-xl border text-center text-sm">
        </div>
        <input type="text" id="inputCatatan" placeholder="Notes (e.g. RPE 8.0)" class="w-full px-3 py-2 themed-input rounded-xl border text-sm">
        <button type="submit" id="btnSaveWorkout" class="bg-blue-600 text-white px-6 py-2.5 rounded-xl text-xs font-semibold">Save Record</button>
      </form>
    </div>
  </main>

  <script>
    // FUNGSI QB13 ADOPSI [source: 2]
    function calculateNextWeekLoadQB13(exercise, targetReps, currentLoad, actualReps, notes) {
      const minTarget = parseInt(targetReps.split('-')[0], 10);
      const avgReps = actualReps.reduce((a, b) => a + b, 0) / actualReps.filter(r => r > 0).length;
      
      let modifier = 0;
      if (avgReps >= minTarget + 2) modifier = 2.5; 
      else if (avgReps >= minTarget) modifier = 1.25;
      else if (avgReps < minTarget) modifier = -2.5;
      
      if (notes && notes.toLowerCase().includes("rpe 10")) modifier -= 2.5;
      
      return Math.max(0, currentLoad + modifier);
    }

    // Integrasi ke dalam addOrUpdateWorkout
    async function addOrUpdateWorkout(e) {
      e.preventDefault();
      const exercise = document.getElementById("inputExercise").value;
      const targetReps = document.getElementById("inputTargetReps").value;
      const workingLoad = parseFloat(document.getElementById("inputWorkingLoad").value) || 0;
      const actualReps = [
        parseInt(document.getElementById("inputSet1").value, 10) || 0,
        parseInt(document.getElementById("inputSet2").value, 10) || 0,
        parseInt(document.getElementById("inputSet3").value, 10) || 0,
        parseInt(document.getElementById("inputSet4").value, 10) || 0
      ];
      const catatan = document.getElementById("inputCatatan").value;

      // Panggil fungsi QB13
      const nextLoad = calculateNextWeekLoadQB13(exercise, targetReps, workingLoad, actualReps, catatan);

      // Sisa logika penyimpanan API Anda tetap di sini...
      console.log("Next Calculated Load:", nextLoad);
      alert("Record saved! Next suggested load: " + nextLoad + " kg");
    }
  </script>
</body>
</html>
