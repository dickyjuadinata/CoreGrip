<!DOCTYPE html>
<html lang="en" class="overflow-x-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CoreGrip</title>
  
  <meta name="theme-color" content="#0066FF">
  <meta name="description" content="CoreGrip - Enterprise-grade resistance training log and auto-progression tracking application.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CoreGrip">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/5200/5200814.png">
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/5200/5200814.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script>
    const manifestData = {
      "name": "CoreGrip",
      "short_name": "CoreGrip",
      "start_url": "./",
      "display": "standalone",
      "background_color": "#f9fafb",
      "theme_color": "#0066FF",
      "description": "CoreGrip - Enterprise-grade resistance training log and auto-progression tracking application.",
      "icons": [
        {
          "src": "https://cdn-icons-png.flaticon.com/512/5200/5200814.png",
          "sizes": "192x192",
          "type": "image/png"
        },
        {
          "src": "https://cdn-icons-png.flaticon.com/512/5200/5200814.png",
          "sizes": "512x512",
          "type": "image/png"
        }
      ]
    };
    const stringManifest = JSON.stringify(manifestData);
    const blobManifest = new Blob([stringManifest], {type: 'application/json'});
    const manifestURL = URL.createObjectURL(blobManifest);
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = manifestURL;
    document.head.appendChild(link);
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body { font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; }
    :root {
      --bg-page: #f9fafb; --bg-card: #ffffff; --bg-header: #161B26; --text-header: #ffffff;
      --bg-subcard: #eff6ff; --bg-input: #ffffff; --text-main: #1f2937; --text-muted: #6b7280;
      --border-color: #e2e8f0; --border-strong: #cbd5e1; --accent-primary: #0066FF;
      --accent-hover: #0052cc; --shadow-color: rgba(0, 102, 255, 0.08);
      --table-header-bg: #eff6ff; --table-header-text: #0066FF;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-page: #0f172a; --bg-card: #1e293b; --bg-header: #161B26; --text-header: #f8fafc;
        --bg-subcard: rgba(30, 58, 138, 0.4); --bg-input: #0f172a; --text-main: #f8fafc;
        --text-muted: #cbd5e1; --border-color: #334155; --border-strong: #475569;
        --accent-primary: #3b82f6; --accent-hover: #60a5fa; --shadow-color: rgba(0, 0, 0, 0.3);
        --table-header-bg: rgba(30, 58, 138, 0.4); --table-header-text: #f8fafc;
      }
    }
    body { background-color: var(--bg-page); color: var(--text-main); }
    .themed-header { background-color: var(--bg-header); color: var(--text-header); }
    .themed-card { background-color: var(--bg-card); border: 1px solid var(--border-color); box-shadow: 0 10px 25px -5px var(--shadow-color); }
    .themed-subcard { background-color: var(--bg-subcard); border: 1px solid var(--border-color); }
    .themed-input { background-color: var(--bg-input) !important; border-color: var(--border-strong) !important; color: var(--text-main) !important; }
    .themed-input:focus { border-color: var(--accent-primary) !important; box-shadow: 0 0 0 3px var(--shadow-color) !important; }
    .themed-text-muted { color: var(--text-muted); }
    .themed-table-header { background-color: var(--table-header-bg); color: var(--table-header-text); }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
  </style>
</head>
<body class="antialiased">

  <header class="themed-header sticky top-0 z-40 w-full">
    <div class="max-w-7xl mx-auto px-4 py-2.5 flex justify-between items-center h-14">
      <div class="flex items-center space-x-2">
        <div class="bg-blue-600 p-1.5 rounded-lg"><i data-lucide="dumbbell" class="w-5 h-5 text-white"></i></div>
        <h1 class="font-black tracking-wider text-sm text-white uppercase">CoreGrip</h1>
      </div>
      <div id="syncStatus" class="hidden text-xs border border-white/20 px-3 py-1.5 rounded-lg text-white items-center gap-1.5">
        <span id="statusIndicator" class="w-2 h-2 rounded-full bg-emerald-400"></span>
        <span id="statusText">Online</span>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto p-4">
    <div id="authSection" class="max-w-xl mx-auto my-8 themed-card rounded-2xl p-6">
      <form id="formLogin" onsubmit="submitLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold themed-text-muted">Username</label>
          <input type="text" id="loginUsername" required class="w-full px-4 py-2 mt-1 rounded-xl themed-input border">
        </div>
        <div>
          <label class="block text-xs font-semibold themed-text-muted">PIN</label>
          <input type="password" id="loginPin" required class="w-full px-4 py-2 mt-1 rounded-xl themed-input border">
        </div>
        <button type="submit" class="w-full bg-[#0066FF] text-white py-3 rounded-xl font-bold">Sign In</button>
      </form>
    </div>

    <div id="appSection" class="hidden w-full">
      <div class="themed-card rounded-2xl p-6 w-full">
        <form id="formWorkout" onsubmit="addOrUpdateWorkout(event)" class="space-y-4">
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
              <label class="block text-xs font-semibold themed-text-muted">Week Number</label>
              <input type="number" id="inputProject" required class="w-full px-4 py-2 mt-1 rounded-xl themed-input border">
            </div>
            <div>
              <label class="block text-xs font-semibold themed-text-muted">Exercise</label>
              <select id="inputExercise" onchange="onExerciseSelect(this.value)" required class="w-full px-4 py-2 mt-1 rounded-xl themed-input border"></select>
            </div>
            <div>
              <label class="block text-xs font-semibold themed-text-muted">Working Load (kg)</label>
              <input type="number" step="0.1" id="inputWorkingLoad" required class="w-full px-4 py-2 mt-1 rounded-xl themed-input border">
            </div>
          </div>
          <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold">Save Record</button>
        </form>
      </div>
    </div>
  </main>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzCKfyt8EHZb1FveYz_RNBDVDb7i0ubsAJqQcIqR5d__7xZcHZaQJeZLftqqEaEol74/exec";
    
    function submitLogin(e) {
      e.preventDefault();
      const username = document.getElementById("loginUsername").value;
      const pin = document.getElementById("loginPin").value;
      
      fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "login", username, pin })
      })
      .then(res => res.json())
      .then(res => {
        if (res.status === "success") {
          localStorage.setItem("coregrip_user", username);
          document.getElementById("authSection").classList.add("hidden");
          document.getElementById("appSection").classList.remove("hidden");
        } else {
          alert(res.message);
        }
      });
    }

    function onExerciseSelect(ex) {
      // Implementasi logika pemilihan latihan
      console.log("Selected:", ex);
    }

    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
    });
  </script>
</body>
</html>
