<!DOCTYPE html>
<html lang="en" class="overflow-x-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CoreGrip</title>
  
  <!-- Meta & PWA -->
  <meta name="theme-color" content="#0066FF">
  <meta name="description" content="CoreGrip - Enterprise-grade resistance training log and auto-progression tracking application.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/5200/5200814.png">
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/5200/5200814.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }

    :root {
      --bg-page: #f9fafb; --bg-card: #ffffff; --bg-header: #161B26;
      --text-header: #ffffff; --bg-subcard: #eff6ff; --bg-input: #ffffff;
      --text-main: #1f2937; --text-muted: #6b7280; --border-color: #e2e8f0;
      --border-strong: #cbd5e1; --accent-primary: #0066FF; --shadow-color: rgba(0, 102, 255, 0.08);
      --table-header-bg: #eff6ff; --table-header-text: #0066FF;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-page: #0f172a; --bg-card: #1e293b; --bg-header: #161B26;
        --text-header: #f8fafc; --bg-subcard: rgba(30, 58, 138, 0.4); --bg-input: #0f172a;
        --text-main: #f8fafc; --text-muted: #cbd5e1; --border-color: #334155;
        --border-strong: #475569; --accent-primary: #3b82f6; --shadow-color: rgba(0, 0, 0, 0.3);
      }
    }

    body { background-color: var(--bg-page); color: var(--text-main); transition: background-color 0.3s ease, color 0.3s ease; }
    .themed-header { background-color: var(--bg-header); color: var(--text-header); }
    .themed-card { background-color: var(--bg-card); border: 1px solid var(--border-color); box-shadow: 0 10px 25px -5px var(--shadow-color); }
    .themed-subcard { background-color: var(--bg-subcard); border: 1px solid var(--border-color); }
    .themed-input { background-color: var(--bg-input) !important; border-color: var(--border-strong) !important; color: var(--text-main) !important; }
    .themed-input:focus { border-color: var(--accent-primary) !important; box-shadow: 0 0 0 3px var(--shadow-color) !important; }
    .themed-table-header { background-color: var(--table-header-bg); color: var(--table-header-text); }
    
    html, body { overflow-x: hidden; scroll-behavior: smooth; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: var(--accent-primary); }
  </style>
</head>
<body class="font-sans min-h-screen flex flex-col antialiased selection:bg-blue-600 selection:text-white">

  <!-- Header -->
  <header class="themed-header border-b border-gray-800 shadow-sm sticky top-0 z-40 w-full">
    <div class="max-w-7xl mx-auto px-4 py-2.5 flex justify-between items-center h-14">
      <div class="flex items-center space-x-6">
        <div class="flex items-center space-x-2">
          <div class="bg-blue-600 p-1.5 rounded-lg flex items-center justify-center">
            <i data-lucide="dumbbell" class="w-5 h-5 text-white"></i>
          </div>
          <h1 class="font-black tracking-wider text-sm md:text-base uppercase text-white">CoreGrip</h1>
        </div>
        <nav id="headerNavTabs" class="hidden items-center space-x-1">
          <button onclick="switchAppTab('workout')" class="px-3.5 py-1.5 text-xs font-bold rounded-lg bg-blue-600 text-white flex items-center gap-2">
            <i data-lucide="clipboard-list" class="w-3.5 h-3.5"></i> Workout Log
          </button>
          <button onclick="switchAppTab('analytics')" class="px-3.5 py-1.5 text-xs font-semibold rounded-lg text-gray-300 hover:text-white flex items-center gap-2">
            <i data-lucide="line-chart" class="w-3.5 h-3.5"></i> Analytics
          </button>
        </nav>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6">
    <!-- Auth Section (Copy dari Source 1) -->
    <div id="authSection" class="max-w-xl mx-auto my-8 themed-card rounded-2xl shadow-xl overflow-hidden">
      <!-- ... Isi Form Login/Register mengikuti desain Source 1 ... -->
    </div>

    <!-- App Section -->
    <div id="appSection" class="hidden space-y-6">
       <!-- Komponen Workout dan Analytics -->
    </div>
  </main>

  <script>
    // Inisialisasi Lucide Icons
    document.addEventListener("DOMContentLoaded", () => { lucide.createIcons(); });
    
    // Fungsi sinkronisasi dasar
    function switchAppTab(tab) { /* Logika switch tab */ }
  </script>
</body>
</html>
