<!DOCTYPE html>
<html lang="en" class="overflow-x-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CoreGrip</title>
  
  <!-- PWA & Favicon -->
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/5200/5200814.png">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/5200/5200814.png">
  
  <!-- Google Font: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS v4 & Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* 1. Global Font */
    body { font-family: 'Inter', system-ui, sans-serif; }

    /* 2. System Light & Dark Mode Auto Theme Variables (Integrated from Opti) */
    :root {
      --bg-body: #f9fafb;
      --bg-card: #ffffff;
      --bg-card-sub: #f9fafb;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --border-color: #f3f4f6;
      --border-strong: #e5e7eb;
      --input-bg: rgba(249, 250, 251, 0.5);
      --dropdown-bg: #ffffff;
      --accent: #0066FF;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-body: #0f172a;
        --bg-card: #1e293b;
        --bg-card-sub: #0f172a;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --border-color: #334155;
        --border-strong: #475569;
        --input-bg: #0f172a;
        --dropdown-bg: #1e293b;
      }
      body { background-color: var(--bg-body) !important; color: var(--text-main) !important; }
      .bg-white { background-color: var(--bg-card) !important; color: var(--text-main) !important; }
      input, textarea, select { background-color: var(--input-bg) !important; color: var(--text-main) !important; border-color: var(--border-strong) !important; }
    }

    /* 3. Custom Searchable Dropdown Styling */
    .searchable-dropdown-container { position: relative; width: 100%; }
    .searchable-dropdown-list {
      position: absolute; top: 100%; left: 0; right: 0; z-index: 50;
      background-color: var(--dropdown-bg); border: 1px solid var(--border-strong);
      border-radius: 0.75rem; margin-top: 0.25rem; max-height: 220px;
      overflow-y: auto; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); display: none;
    }
    .searchable-dropdown-item { padding: 0.75rem 1rem; cursor: pointer; font-size: 0.875rem; }
    .searchable-dropdown-item:hover { background-color: #eff6ff; color: #0066FF; }

    /* 4. Loading Spinner Animation */
    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.3); border-radius: 50%;
      border-top: 4px solid var(--accent); width: 50px; height: 50px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="antialiased selection:bg-blue-100">

    <!-- Toast Notification -->
    <div id="toastNotification" class="fixed bottom-6 right-6 z-50 transform translate-y-10 opacity-0 transition-all duration-300 pointer-events-none">
        <div id="toastContent" class="flex items-center gap-2 px-4 py-3 rounded-xl shadow-lg text-xs font-semibold text-white bg-amber-600">
            <i data-lucide="alert-triangle" class="w-4 h-4"></i>
            <span id="toastMessage">Status message here.</span>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="fixed inset-0 bg-gray-900/40 backdrop-blur-xs z-50 flex items-center justify-center hidden">
        <div class="bg-white p-6 rounded-2xl flex flex-col items-center gap-3">
            <div class="spinner"></div>
            <p class="text-sm font-semibold">Processing...</p>
        </div>
    </div>

</body>
</html>
